name: T20 Best XI CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  version-check:
    name: Version Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show environment versions
        run: |
          python --version
          python -c "import platform; print('Platform:', platform.platform())"

  test:
    name: Automated Tests
    runs-on: ubuntu-latest
    needs: version-check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt

      - name: Install test dependencies
        run: |
          pip install pytest httpx

      - name: Run tests
        run: |
          pytest -q

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: version-check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tool
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff
        run: |
          ruff check api/api.py tests/test_ci_api.py

  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - test
      - lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t t20-best-xi-api:ci \
            -f api/Dockerfile \
            .

      - name: Verify Docker image
        run: |
          docker images t20-best-xi-api
